name: Build Android NDK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable-diffusion.cpp
        uses: actions/checkout@v4
        with:
          repository: leejet/stable-diffusion.cpp
          submodules: recursive

      - name: Setup Ninja & packages
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake zip

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27b
          add-to-path: true

      - name: Configure
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          echo "NDK path: $ANDROID_NDK_HOME"
          ls $ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake
          mkdir -p build-android
          cd build-android
          cmake .. -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_OPENMP=OFF \
            -DSD_OPENCL=OFF \
            -DSD_CUDA=OFF \
            -DSD_VULKAN=OFF \
            -DSD_METAL=OFF

      - name: Build
        run: |
          cd build-android
          ninja -v -j$(nproc)

      - name: Verify binary type
        run: |
          file build-android/bin/sd-cli

      - name: Package
        run: |
          mkdir -p artifact
          cp build-android/bin/sd-cli build-android/bin/sd-server artifact/
          chmod +x artifact/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sd-android-ndk
          path: artifact/
